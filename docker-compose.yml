services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bellavista_app
    ports:
      - "8081:80"
    volumes:
      # El código de la aplicación se monta fuera del DocumentRoot.
      - ./config:/var/www/html/config:ro
      - ./src:/var/www/html/src:ro
      # public/ es de solo lectura: Apache nunca necesita escribir ahí.
      - ./public:/var/www/html/public:ro
      # Logs persistentes para Wazuh SIEM.
      - app_logs:/var/log/app
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:?Defina DB_NAME en .env}
      DB_USER: ${DB_USER:?Defina DB_USER en .env}
      DB_PASS: ${DB_PASS:?Defina DB_PASS en .env}
      APP_ENV: ${APP_ENV:-production}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Lima}
      SESSION_IDLE_TIMEOUT: ${SESSION_IDLE_TIMEOUT:-1800}
      SECURITY_LOG_PATH: ${SECURITY_LOG_PATH:-/var/log/app/security.log}
      RATE_LIMIT_DIR: ${RATE_LIMIT_DIR:-/tmp/optica_bellavista_ratelimit}
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: bellavista_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Defina DB_NAME en .env}
      MYSQL_USER: ${DB_USER:?Defina DB_USER en .env}
      MYSQL_PASSWORD: ${DB_PASS:?Defina DB_PASS en .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD en .env}
      TZ: ${APP_TIMEZONE:-America/Lima}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  db_data:
  app_logs: