version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bellavista_app
    ports:
      - "8081:80"
    volumes:
      - ./src:/var/www/html
    environment:
      - DB_HOST=db
      - DB_NAME=optica_bellavista
      - DB_USER=bellavista_user
      - DB_PASS=Bellavista2026!
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: bellavista_db
    restart: always
    environment:
      MYSQL_DATABASE: optica_bellavista
      MYSQL_USER: bellavista_user
      MYSQL_PASSWORD: Bellavista2026!
      MYSQL_ROOT_PASSWORD: RootSecurePass2026!
      TZ: "America/Lima" # Zona horaria ajustada
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  db_data:
