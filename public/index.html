<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Óptica Bellavista | ERP / POS</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app">
        <div id="sidebar-overlay" class="sidebar-overlay"></div>

        <aside class="sidebar" aria-label="Menú principal">
            <div class="sidebar-logo">
                <div class="logo-badge" aria-hidden="true">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <circle cx="8" cy="12" r="5.2"></circle>
                        <circle cx="16" cy="12" r="5.2"></circle>
                        <path d="M11 10.5c1.3-1 2.7-1 4 0"></path>
                    </svg>
                </div>
                <div>
                    <strong>Óptica Bellavista</strong>
                    <span>ERP / POS</span>
                </div>
            </div>

            <nav class="nav" id="nav-menu">
                <a href="#/dashboard" class="nav-link" data-module="dashboard">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 11.5 12 3l9 8.5"></path>
                        <path d="M5 9.5V21h14V9.5"></path>
                        <path d="M9.5 21v-6h5v6"></path>
                    </svg>
                    <span>Inicio</span>
                </a>

                <a href="#/pacientes" class="nav-link" data-module="pacientes">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="9" cy="8" r="3.5"></circle>
                        <path d="M2.8 20c.7-3.2 3.4-5 6.2-5s5.5 1.8 6.2 5"></path>
                        <circle cx="18" cy="9" r="2.5"></circle>
                        <path d="M17.5 20c.3-1.7 1.5-2.9 3-3"></path>
                    </svg>
                    <span>Pacientes</span>
                </a>

                <a href="#/historias" class="nav-link" data-module="historias">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="5" y="4" width="14" height="17" rx="2"></rect>
                        <path d="M9 9h6M9 13h6M9 17h4"></path>
                    </svg>
                    <span>Historias Clínicas</span>
                </a>

                <a href="#/inventario" class="nav-link" data-module="inventario">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 8l9-5 9 5v8l-9 5-9-5z"></path>
                        <path d="M3 8l9 5 9-5"></path>
                        <path d="M12 13v8"></path>
                    </svg>
                    <span>Inventario</span>
                </a>

                <a href="#/contratos" class="nav-link" data-module="contratos">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M6 2h9l5 5v15H6z"></path>
                        <path d="M14 2v5h5"></path>
                        <path d="M9 13h6M9 17h6"></path>
                    </svg>
                    <span>Contratos</span>
                </a>

                <a href="#/caja" class="nav-link" data-module="caja">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="6" width="18" height="13" rx="2"></rect>
                        <circle cx="12" cy="12.5" r="2.5"></circle>
                        <path d="M6 6v-1h13v1"></path>
                    </svg>
                    <span>Cuaderno de Ventas (Caja)</span>
                </a>

                <a href="#/usuarios" class="nav-link" data-module="usuarios" id="nav-usuarios" hidden>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="8" r="3.5"></circle>
                        <path d="M5.5 20c.8-3.2 3.4-5 6.5-5s5.7 1.8 6.5 5"></path>
                        <path d="M19 4l.8 1.6L21 6.4l-1.2.8L19 9l-.8-1.8L17 6.4l1.2-.8z"></path>
                    </svg>
                    <span>Gestión de Usuarios</span>
                </a>
            </nav>

            <button id="btn-cerrar-sesion" class="btn-logout" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 3v9"></path>
                    <path d="M5.5 8a7 7 0 1 0 13 0"></path>
                </svg>
                <span>Cerrar Sesión</span>
            </button>
        </aside>

        <main class="main">
            <header class="topbar">
                <button id="btn-toggle-menu" class="icon-btn" type="button" aria-label="Abrir o cerrar menú">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <path d="M4 7h16M4 12h16M4 17h16"></path>
                    </svg>
                </button>

                <div class="topbar-usuario">
                    <strong id="topbar-nombre">&mdash;</strong>
                    <span id="topbar-rol">&mdash;</span>
                </div>

                <span id="topbar-fecha" class="topbar-fecha"></span>
            </header>

            <section id="main-content" class="content" tabindex="-1" aria-live="polite"></section>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
