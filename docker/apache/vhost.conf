# ============================================================
# ÓPTICA BELLAVISTA - VirtualHost principal
# DocumentRoot aislado: SOLO se expone /var/www/html/public
# ============================================================

# Nivel servidor: ocultar versión y firma del software
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    ServerName localhost
    ServerAdmin webmaster@bellavista.local

    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.html
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>